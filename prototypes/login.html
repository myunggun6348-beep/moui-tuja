<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 모의투자 시안</title><link rel="stylesheet" href="style.css"></head>
<body><main class="login"><header><div class="logo" aria-hidden="true">↗</div><h1>모의투자</h1><p>닉네임과 PIN으로 로그인하세요.</p></header><section class="card"><form id="login-form"><label for="nickname">닉네임</label><input id="nickname" name="nickname" autocomplete="off" placeholder="사용 중인 닉네임" required><label for="pin">PIN <span class="muted">로그인 비밀번호</span></label><div class="pin"><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN 입력" required aria-describedby="pin-help"><button type="button" id="toggle" aria-label="PIN 보기" aria-controls="pin" aria-pressed="false">보기</button></div><p class="hint" id="pin-help">PIN을 잊었다면 관리자에게 문의하세요.</p><button class="primary" type="submit">로그인</button><p id="status" role="status" class="status"></p></form><div class="secondary"><button type="button" id="join">처음 이용하시나요? 참가 코드로 시작</button><a href="help.html">이용 방법 보기 →</a></div></section><p class="notice">디자인 시안입니다. 실제 로그인은 연결되지 않았습니다.<br>실제 닉네임이나 PIN을 입력하지 마세요.</p></main>
<script>const pin=document.querySelector('#pin'),toggle=document.querySelector('#toggle'),status=document.querySelector('#status');toggle.addEventListener('click',()=>{const show=pin.type==='password';pin.type=show?'text':'password';toggle.textContent=show?'숨기기':'보기';toggle.setAttribute('aria-label',show?'PIN 숨기기':'PIN 보기');toggle.setAttribute('aria-pressed',String(show));});document.querySelector('#login-form').addEventListener('submit',e=>{e.preventDefault();status.textContent='시안에서는 로그인할 수 없습니다. 실제 로그인은 원본 인증 기능을 연결한 뒤 이용할 수 있습니다.';});document.querySelector('#join').addEventListener('click',()=>{status.textContent='참가 코드로 시작하는 기능은 원본 서비스 연결 후 이용할 수 있습니다.';});</script></body></html>
